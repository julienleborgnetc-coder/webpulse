<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" opacity="1"/>
  
  <!-- Inner dark circle -->
  <circle cx="256" cy="256" r="210" fill="#0f0a2e" opacity="0.85"/>
  
  <!-- Pulse wave (heartbeat/signal style) -->
  <path d="M80 270 L160 270 L190 270 L210 200 L240 340 L270 180 L300 320 L320 230 L340 270 L420 270" 
        fill="none" stroke="url(#pulse-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.6"/>
  
  <!-- Small dot accents -->
  <circle cx="80" cy="270" r="6" fill="#818cf8"/>
  <circle cx="420" cy="270" r="6" fill="#60a5fa"/>
</svg>
