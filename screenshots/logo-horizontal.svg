<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(20, 20)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="95" fill="url(#grad)"/>
    <!-- Inner dark circle -->
    <circle cx="100" cy="100" r="82" fill="#0f0a2e" opacity="0.85"/>
    <!-- Pulse wave -->
    <path d="M32 105 L58 105 L68 105 L76 75 L90 135 L104 65 L118 125 L128 90 L136 105 L168 105" 
          fill="none" stroke="url(#pulse-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Outer ring -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.5"/>
    <!-- Dots -->
    <circle cx="32" cy="105" r="3" fill="#818cf8"/>
    <circle cx="168" cy="105" r="3" fill="#60a5fa"/>
  </g>
  
  <!-- Text "WebPulse" -->
  <text x="250" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="90" font-weight="800" fill="white" letter-spacing="-2">
    Web<tspan fill="url(#text-grad)">Pulse</tspan>
  </text>
</svg>
